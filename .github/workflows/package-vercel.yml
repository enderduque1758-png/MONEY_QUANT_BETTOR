name: Package Vercel Production ZIP

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/src package/server package/api package/scripts

          cp .nvmrc package/
          cp .env.example package/
          cp index.html package/
          cp package.json package/
          cp package-lock.json package/
          cp vercel.json package/
          cp scripts/build-static.mjs package/scripts/

          cp -R src/. package/src/
          cp -R server/. package/server/
          cp api/*.js package/api/

          cat > package/DEPLOY_VERCEL.txt <<'EOF'
          MONEY_QUANT_BETTOR - Vercel Production

          1. Upload/import this folder into Vercel.
          2. Framework preset: Other / No framework.
          3. Build command: npm run build
          4. Output directory: dist
          5. Node.js: 22.x
          6. Root directory: project root (.).
          7. Configure these secrets in Vercel Production:
             THE_ODDS_API_KEY
             API_FOOTBALL_KEY
          8. Recommended for durable learning/state across devices:
             UPSTASH_REDIS_REST_URL
             UPSTASH_REDIS_REST_TOKEN
             (or KV_REST_API_URL / KV_REST_API_TOKEN)
          9. Redeploy after adding/changing environment variables.
          10. Validate /, /api/health, /api/sports, /api/odds, /api/state and /api/settle.
          EOF

          cd package
          zip -r ../MONEY_QUANT_BETTOR_VERCEL_STATIC_FIX.zip .

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MONEY_QUANT_BETTOR_VERCEL_STATIC_FIX
          path: MONEY_QUANT_BETTOR_VERCEL_STATIC_FIX.zip
          if-no-files-found: error
          retention-days: 7
