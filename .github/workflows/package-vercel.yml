name: Package Vercel Production ZIP

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Verify production integration
        run: npm run test:prod
      - name: Build production source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/src package/server package/api package/scripts
          cp .nvmrc package/
          cp .env.example package/
          cp index.html package/
          cp package.json package/
          cp package-lock.json package/
          cp vercel.json package/
          cp scripts/build-static.mjs package/scripts/
          cp scripts/prod-smoke.mjs package/scripts/
          cp -R src/. package/src/
          cp -R server/. package/server/
          cp api/*.js package/api/
          cat > package/DEPLOY_VERCEL.txt <<'EOF'
          MONEY_QUANT_BETTOR - Vercel Production Integration v2

          Framework preset: Other / No framework
          Build command: npm run build
          Output directory: dist
          Node.js: 22.x
          Root directory: .

          Required Production secrets:
          THE_ODDS_API_KEY
          API_FOOTBALL_KEY
          UPSTASH_REDIS_REST_URL
          UPSTASH_REDIS_REST_TOKEN
          (KV_REST_API_URL / KV_REST_API_TOKEN are accepted alternatives for persistence)

          /api/health intentionally returns 503 while required production configuration is incomplete.
          Validate: /, /api/health, /api/preflight, /api/sports, /api/odds, /api/state, /api/settle, /api/closing-line.
          EOF
          cd package
          zip -r ../MONEY_QUANT_BETTOR_VERCEL_STATIC_FIX.zip .
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MONEY_QUANT_BETTOR_VERCEL_STATIC_FIX
          path: MONEY_QUANT_BETTOR_VERCEL_STATIC_FIX.zip
          if-no-files-found: error
          retention-days: 7
