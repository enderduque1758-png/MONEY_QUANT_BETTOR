services:
  - type: web
    name: money-quant-bettor
    runtime: docker
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: THE_ODDS_API_KEY
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: BETANO_SUPPORT_API_KEY
        sync: false
